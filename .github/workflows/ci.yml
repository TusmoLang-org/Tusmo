name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.11.0"
  ZIG_TRIPLET: "zig-linux-x86_64"

jobs:
  # ---------------------------------------------------------------------
  # Repository integrity + the language test suite + the language server.
  # ---------------------------------------------------------------------
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ply requests pygls lsprotocol

      - name: Repository preflight
        run: bash .github/scripts/preflight.sh

      - name: Updater regression tests
        run: python3 .github/scripts/test_updater.py

      - name: Language test suite
        run: python3 .github/scripts/run_tests.py

      - name: Language server tests
        run: python3 Extension/server/test_server.py -v

  # ---------------------------------------------------------------------
  # Builds the exact artefact users download and proves it installs and
  # compiles a program on a machine without any C compiler.
  # ---------------------------------------------------------------------
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils curl libgl1-mesa-dev libx11-dev
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ply requests pygls lsprotocol

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ env.ZIG_TRIPLET }}

      - name: Download zig (complete distribution)
        run: |
          if [ ! -x "$RUNNER_TEMP/zig/zig" ]; then
            curl --retry 5 --retry-delay 5 --retry-connrefused -L \
              "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TRIPLET}-${ZIG_VERSION}.tar.xz" \
              -o "$RUNNER_TEMP/zig.tar.xz"
            mkdir -p "$RUNNER_TEMP/zig"
            tar -xf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          fi
          "$RUNNER_TEMP/zig/zig" version
          echo "ZIG_DIR=$RUNNER_TEMP/zig" >> "$GITHUB_ENV"

      - name: Build tusmo CLI (onedir)
        run: |
          pyinstaller --onedir --noconfirm tusmo.py \
            --hidden-import compiler \
            --hidden-import compiler.frontend \
            --hidden-import compiler.midend \
            --hidden-import compiler.backend \
            --hidden-import ply.lex \
            --hidden-import ply.yacc \
            --hidden-import requests \
            --add-data "compiler:compiler" \
            --add-data "stdlib:stdlib"

      - name: Build language server (onefile)
        run: |
          pyinstaller --onefile --noconfirm Extension/server/tusmo_hover_server.py \
            -n tusmo-hover \
            --paths . \
            --hidden-import compiler \
            --hidden-import compiler.frontend \
            --hidden-import compiler.midend \
            --hidden-import compiler.backend \
            --hidden-import ply.lex \
            --hidden-import ply.yacc \
            --hidden-import pygls \
            --hidden-import lsprotocol \
            --hidden-import lsprotocol.types \
            --add-data "compiler:compiler"

      - name: Assemble release bundle
        run: |
          bash .github/scripts/build_bundle.sh \
            --dist dist/tusmo \
            --zig "$ZIG_DIR" \
            --out bundle \
            --triplet linux-x86_64

      - name: Install platform Raylib
        run: bash .github/scripts/prepare_raylib.sh --bundle bundle --triplet linux-x86_64

      - name: Pack platform bundle
        run: tar -czf tusmo-linux-x86_64.tar.gz -C bundle .

      - name: Verify the install end to end (offline sandbox)
        run: bash .github/scripts/verify_install.sh tusmo-linux-x86_64.tar.gz

      - name: Upload candidate build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tusmo-linux-x86_64
          path: tusmo-linux-x86_64.tar.gz
          if-no-files-found: error
