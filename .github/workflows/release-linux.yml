name: release-linux

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.11.0"
  ZIG_TRIPLET: "zig-linux-x86_64"
  TRIPLET: "linux-x86_64"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils curl
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ply requests pygls lsprotocol

      - name: Repository preflight
        run: bash .github/scripts/preflight.sh

      - name: Download zig (complete distribution)
        run: |
          # The whole distribution is required: `zig cc` loads its headers and
          # compiler resources from the sibling lib/ directory. Shipping only
          # the binary breaks every compile on machines without a C compiler.
          curl --retry 5 --retry-delay 5 --retry-connrefused -L \
            "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TRIPLET}-${ZIG_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/zig" version
          echo "ZIG_DIR=$RUNNER_TEMP/zig" >> "$GITHUB_ENV"

      - name: Build tusmo CLI (onedir)
        run: |
          pyinstaller --onedir --noconfirm tusmo.py \
            --hidden-import compiler \
            --hidden-import compiler.frontend \
            --hidden-import compiler.midend \
            --hidden-import compiler.backend \
            --hidden-import ply.lex \
            --hidden-import ply.yacc \
            --hidden-import requests \
            --add-data "compiler:compiler" \
            --add-data "stdlib:stdlib"

      - name: Build language server (onefile)
        run: |
          pyinstaller --onefile --noconfirm Extension/server/tusmo_hover_server.py \
            -n tusmo-hover \
            --paths . \
            --hidden-import compiler \
            --hidden-import compiler.frontend \
            --hidden-import compiler.midend \
            --hidden-import compiler.backend \
            --hidden-import ply.lex \
            --hidden-import ply.yacc \
            --hidden-import pygls \
            --hidden-import lsprotocol \
            --hidden-import lsprotocol.types \
            --add-data "compiler:compiler"

      - name: Build VS Code extension (VSIX)
        id: vsix
        continue-on-error: true
        run: |
          cd Extension
          npm install
          npx --yes @vscode/vsce package --out ../tusmo-vscode.vsix \
            --allow-missing-repository --no-git

      - name: Assemble release bundle
        run: |
          bash .github/scripts/build_bundle.sh \
            --dist dist/tusmo \
            --zig "$ZIG_DIR" \
            --out bundle \
            --triplet "$TRIPLET"

      - name: Verify the install end to end (offline sandbox)
        run: bash .github/scripts/verify_install.sh "tusmo-${TRIPLET}.tar.gz"

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tusmo-${{ env.TRIPLET }}
          path: |
            tusmo-${{ env.TRIPLET }}.tar.gz
            tusmo-vscode.vsix
          if-no-files-found: warn

      - name: Upload release tarball
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: tusmo-${{ env.TRIPLET }}.tar.gz
          fail_on_unmatched_files: true

      - name: Upload VS Code extension
        if: startsWith(github.ref, 'refs/tags/') && steps.vsix.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          files: tusmo-vscode.vsix
          fail_on_unmatched_files: true
