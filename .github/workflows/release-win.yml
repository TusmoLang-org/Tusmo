name: release-win

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.11.0"
  ZIG_TRIPLET: "zig-windows-x86_64"
  TRIPLET: "windows-x86_64"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ply requests pygls lsprotocol windows-curses

      - name: Repository preflight
        shell: bash
        run: bash .github/scripts/preflight.sh

      - name: Download zig (complete distribution)
        shell: pwsh
        run: |
          # The whole distribution is required: `zig cc` loads its headers and
          # compiler resources from the sibling lib/ directory.
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/$env:ZIG_TRIPLET-$env:ZIG_VERSION.zip"
          $zip = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $dest = Join-Path $env:RUNNER_TEMP "zig"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest
          # Expand-Archive keeps the top level folder - flatten it.
          $inner = Get-ChildItem -Directory $dest | Select-Object -First 1
          if ($inner) {
            Get-ChildItem $inner.FullName | Move-Item -Destination $dest
            Remove-Item -Recurse -Force $inner.FullName
          }
          & (Join-Path $dest "zig.exe") version
          "ZIG_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build tusmo CLI (onedir)
        shell: pwsh
        run: |
          pyinstaller --onedir --noconfirm tusmo.py `
            --hidden-import compiler `
            --hidden-import compiler.frontend `
            --hidden-import compiler.midend `
            --hidden-import compiler.backend `
            --hidden-import ply.lex `
            --hidden-import ply.yacc `
            --hidden-import requests `
            --add-data "compiler;compiler" `
            --add-data "stdlib;stdlib"

      - name: Build language server (onefile)
        shell: pwsh
        run: |
          pyinstaller --onefile --noconfirm Extension/server/tusmo_hover_server.py `
            -n tusmo-hover `
            --paths . `
            --hidden-import compiler `
            --hidden-import compiler.frontend `
            --hidden-import compiler.midend `
            --hidden-import compiler.backend `
            --hidden-import ply.lex `
            --hidden-import ply.yacc `
            --hidden-import pygls `
            --hidden-import lsprotocol `
            --hidden-import lsprotocol.types `
            --add-data "compiler;compiler"

      - name: Assemble release bundle
        shell: bash
        run: |
          bash .github/scripts/build_bundle.sh \
            --dist dist/tusmo \
            --zig "$ZIG_DIR" \
            --out bundle \
            --triplet "$TRIPLET"

      - name: Verify the install end to end (offline sandbox)
        shell: pwsh
        run: .\.github\scripts\verify_install.ps1 -Tarball "tusmo-$env:TRIPLET.tar.gz"

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tusmo-${{ env.TRIPLET }}
          path: tusmo-${{ env.TRIPLET }}.tar.gz
          if-no-files-found: error

      - name: Upload release tarball
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: tusmo-${{ env.TRIPLET }}.tar.gz
          fail_on_unmatched_files: true
