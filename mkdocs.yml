site_name: Tusmo
site_description: Luuqadda Rasmiga ah ee Tusmo - A General Purpose Somali Programming Language.
site_url: https://tusmolang-org.github.io/Tusmo/
repo_url: https://github.com/TusmoLang-org/Tusmo
repo_name: TusmoLang-org/Tusmo
hooks:
  - docs/hooks.py
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - code.copy

nav:
  - Bogga Hordhaca: index.md
  - Bilaabista Degdegga ah: bilaabista.md
  - Aasaaska Luuqada: aasaaska.md
  - Heerka Sare: heerka_sare.md
  - Maktabadda Caadiga ah: maktabada.md
  - Agabka & Deegaanka: agabka.md
  - Ka Qaybqaadashada: bulshada.md
